<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1.6</title>
    <style>
        .box {
            background-color: black;
            width: 300px;
            height: 300px;
            padding: 30px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .box1 {
            background-color: black;
            width: 300px;
            height: 300px;
            padding: 30px;
        }
        .element {
            background-color: pink;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="element"></div>
    </div>
    <div class="box1">
        <div class="element"></div>
    </div>
</body>

</html>
