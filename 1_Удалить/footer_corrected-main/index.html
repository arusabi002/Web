<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footer</title>
    <link rel="stylesheet" href="main.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <footer class="footer">
      <div class="footer__container">
        <div class="footer__logo"><img src="images/logo.svg" alt=""></div>
        <div class="footer__phone-address">
          <a href="tel:+79995435454" class="footer__text footer__phone">+7 (999) 543-54-54</a>
          <address class=" footer__text footer__address">Мастерская</address>
        </div>
        <div class="footer__list footer__reproduction-country">
          <div class="footer__reproduction">Репродукции</div>
          <ul>
            <li class="footer__text footer__country">Франция</li>
            <li class="footer__text footer__country">Германия</li>
            <li class="footer__text footer__country">Англия</li>
          </ul>
        </div>
        <div class="footer__list footer__news-year">
          <div class="footer__news">Новинки</div>
          <ul>
            <li class="footer__text footer__year">2021</li>
            <li class="footer__text footer__year">2020</li>
          </ul>
        </div>
        <div class="footer__list footer__about-people">
            <div class="footer__about">О нас</div>
            <ul>
              <li class="footer__text footer__people">Художники</li>
              <li class="footer__text footer__people">Менеджеры</li>
            </ul>
        </div>
        <div class="footer__socials-reserved">
          <ul class="footer__socials">
            <li class="footer__facebook"><a href="#"><img src="images/Facebook.svg" alt="facebook"></a></li>
            <li class="footer__instagram"><a href="#"><img src="images/insta.svg" alt="instagram"></a></li>
            <li class="footer__youtube"><a href="#"><img src="images/Youtube.svg" alt="youtube"></a></li>
          </ul>
          <div class="footer__text  footer__reserved"><span>Ink. House ® </span><span>All rights reserved</span></div>
        </div>
      </div>
    </footer>
  </body>
</html>
